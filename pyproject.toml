[project]
name = "ai-buddy"
version = "0.1.0"
description = "Local voice companion for chatting and speaking practice, running on the Ryzen AI NPU via Lemonade + FastFlowLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "websockets>=14",
    "playwright>=1.49",
]

[project.scripts]
ai-buddy = "ai_buddy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_buddy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["lemonade: needs a running Lemonade server with the configured models"]
