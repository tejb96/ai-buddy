# AI Buddy configuration. Restart the app after editing.
# Voice, model and knowledge folder can also be changed in the app (gear icon); those choices are saved in
# <data_dir>/settings.json and take precedence over the values here.

[lemonade]
base_url = "http://localhost:13305/v1"
# Seconds to wait for a single model load (the 35B MoE takes ~15 s on this laptop).
load_timeout_s = 180

[models]
# Everything runs locally through Lemonade: FLM models on the NPU, Kokoro on the CPU.
stt = "whisper-v3-turbo-FLM"            # speech-to-text (NPU); its transcript is what the LLM reads
llm = "qwen3.5-9b-FLM"                  # the assistant: conversation, tools, coaching; thinking off (NPU)
tts = "kokoro-v1"                       # text-to-speech (CPU)
llm_ctx_size = 32768
# Language models offered in the settings panel. Gemma 4 12B is a little slower to answer; the 35B needs 22 GB.
llm_choices = ["qwen3.5-9b-FLM", "gemma4-it-12b-FLM", "qwen3.6-moe-35b-a3b-FLM"]
# Speech-to-text models offered in the settings panel. Whisper-Large-v3-Turbo is the same model on whisper.cpp,
# run on the CPU (stt_backend; "vulkan" would use the iGPU after `lemonade backends install whispercpp:vulkan`).
stt_choices = ["whisper-v3-turbo-FLM", "Whisper-Large-v3-Turbo"]
stt_backend = "cpu"
# Embedding model for note search, run by llama.cpp on the CPU; search then combines meaning and keywords.
# "" = keywords only. Changing it re-embeds the notes. NOT SET UP YET (see docs/phase0-findings.md, "Start
# here"): first `lemonade backends install llamacpp:cpu` and `lemonade pull Qwen3-Embedding-0.6B-GGUF`,
# check that it loads on the CPU, then set embed = "Qwen3-Embedding-0.6B-GGUF".
embed = ""
embed_backend = "cpu"
embed_threads = 4                       # leaves CPU cores free for Kokoro

[chat]
temperature = 0.6
max_tokens = 300
# Drop the oldest exchanges when the conversation history gets longer than this many words.
history_word_budget = 8000
# Kira writes a short greeting when a chat starts; it also preloads the model's prompt cache.
greet = true
timeout_s = 90                # give up on a reply that takes longer than this

[feedback]
# Lets the model "think" before writing feedback: deeper, but 30 s or more slower.
think = false
max_tokens = 1500
temperature = 0.4

[stt]
# Push-to-talk turns longer than ~live_chunk_s are transcribed in pieces while you talk, cut in pauses
# of at least live_pause_s, so only the last piece is left when you let go.
live_chunk_s = 15
live_chunk_max_s = 25
live_pause_s = 0.5

[voice]
tts_voice = "af_bella"   # default Kokoro voice; pick another in the app. The assistant is named after it: Bella
tts_speed = 1.0
language = "en"

[persona]
# The assistant's name is its voice's name (Bella, Emma, George...): change the voice to change the name.
style = "warm, encouraging and honest"

[user]
location = ""                 # e.g. "Calgary, Alberta": assumed when you don't name a place

[skills]
# Every capability is a skill (Agent Skills format: a folder with SKILL.md; built-ins in ai_buddy/skills/builtin).
# Switch skills on or off here or in the app (gear icon); the app's switches take precedence.
enabled = ["web-search", "notes", "clock", "calculator", "speaking-coach"]
dirs = []                     # folders with your own skills
confirm_timeout_s = 60        # skills that change things ask first; no answer within this = no

# MCP servers become skills too: switch them on in the app (gear icon, "MCP servers"), or add the name to
# skills.enabled. A tool asks you before it runs unless the server marks it read-only, or it's in auto_approve.
# In command, args, env and headers: {folder} = a folder you pick in the app, {timezone} = your time zone,
# ${NAME} = a secret from ~/.local/share/ai-buddy/secrets.env (NAME=value lines; keep tokens out of this file).
# `tools` limits which of a server's tools the model sees (each one costs prompt space). To add a server, copy
# one of these, then press "Reload servers" in the app. url = "http://..." connects to a running server instead.
# The three below are the official reference servers (versions pinned; npx and uvx fetch them on first use).

[mcp.servers.files]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem@1.0.0", "{folder}"]
description = "Reads and writes files in a folder you choose, and asks before changing anything"
tools = ["read_text_file", "list_directory", "search_files", "get_file_info", "write_file", "edit_file",
         "create_directory", "move_file"]

[mcp.servers.fetch]
command = "uvx"
args = ["mcp-server-fetch==2026.10.10"]
description = "Reads a web page you name and turns it into text"

[mcp.servers.time]
command = "uvx"
args = ["mcp-server-time==2026.10.10", "--local-timezone", "{timezone}"]
description = "Tells the time in any time zone and converts times between zones"

# GitHub (repositories, issues, pull requests; read-only here). Needs a personal access token: put
# GITHUB_TOKEN=github_pat_... in ~/.local/share/ai-buddy/secrets.env, then uncomment ONE of these. See the
# README ("GitHub") for the token's permissions and the binary's download.
# [mcp.servers.github]
# command = "github-mcp-server"           # the release binary, unpacked into ~/.local/bin
# args = ["stdio"]
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}", GITHUB_TOOLSETS = "repos,issues,pull_requests", GITHUB_READ_ONLY = "1" }
# description = "Your GitHub repositories, issues and pull requests"
#
# [mcp.servers.github]                    # or GitHub's hosted server, nothing to install
# url = "https://api.githubcopilot.com/mcp/readonly"
# headers = { Authorization = "Bearer ${GITHUB_TOKEN}" }
# description = "Your GitHub repositories, issues and pull requests"

[tools]
max_calls_per_turn = 3
timeout_s = 15                # per tool call
search_backend = "duckduckgo" # "duckduckgo" (no key needed) or "searxng"
searxng_url = ""              # e.g. "http://localhost:8888" for a self-hosted SearXNG with JSON output enabled
search_results = 5
pages_to_read = 2             # top results Kira opens and reads
page_chars = 1200             # text kept from each page (the model reads ~1 token per 4 characters)
fetch_timeout_s = 6

[rag]
# Kira's knowledge folder: notes, talking points, resumes, READMEs (Markdown, text, PDF, DOCX, HTML).
folder = "~/Documents/ai-buddy-notes"
watch = true                  # re-index automatically when files change
chunk_chars = 1200
chunk_overlap = 200
top_k = 4
max_file_mb = 20

[practice]
long_pause_s = 2.0            # silence inside speech at least this long counts as a long pause
target_wpm_low = 120
target_wpm_high = 160
presentation_chunk_s = 25     # transcribe presentations in chunks of about this length while you talk

[app]
host = "127.0.0.1"
port = 8765
data_dir = "~/.local/share/ai-buddy"
save_audio = false            # also keep a WAV of every practice session
open_window = true            # open a Chrome app window on start (falls back to the default browser)
